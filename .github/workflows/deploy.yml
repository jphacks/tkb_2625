name: Deploy

on:
  push:
    branches: [main]

concurrency: deploy

env:
  CLIENT_DIR: /srv/rogaining/client
  APPVIEW_DIR: /srv/rogaining/appview
  APPVIEW_SERVICE: rogaining-appview.service

# self-hosted runner: Node.js 24, pnpm, rsync, systemctl再起動権限が必要。
# 配信対象は既存のclientのまま。frontの本番配信は別途設定する。
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build client and appview
        run: pnpm --filter client --filter appview run build
      - name: Package appview runtime
        run: pnpm --filter appview --prod deploy .deploy/appview
      - name: Deploy client
        run: rsync -a --delete client/dist/ "${{ env.CLIENT_DIR }}/"
      - name: Deploy appview
        run: |
          rsync -a --delete .deploy/appview/dist/ "${{ env.APPVIEW_DIR }}/dist/"
          rsync -a --delete .deploy/appview/node_modules/ "${{ env.APPVIEW_DIR }}/node_modules/"
          cp .deploy/appview/package.json "${{ env.APPVIEW_DIR }}/"
          sudo systemctl restart "${{ env.APPVIEW_SERVICE }}"
