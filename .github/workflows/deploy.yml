name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

env:
  CLIENT_DIR: /srv/rogaining/client
  APPVIEW_DIR: /srv/rogaining/appview
  APPVIEW_SERVICE: rogaining-appview.service

# self-hosted runner 側で必要なもの: rsync
# リポジトリ Variables: APPVIEW_DIR (例 /srv/rogaining/appview), CLIENT_DIR (例 /srv/rogaining/client)
# APPVIEW_SERVICE は systemd unit。runnerユーザーがパスワードなしで
# `sudo systemctl restart <unit>` できるようにしておく
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build client
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build appview
        working-directory: appview
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy client
        run: rsync -a --delete client/dist/ "${{ env.CLIENT_DIR }}/"

      # マイグレーションは appview の起動時に drizzle/ から自動で適用される
      # pnpm-workspace.yaml は better-sqlite3 のネイティブビルド許可 (allowBuilds) に必要
      - name: Deploy appview
        run: |
          rsync -a --delete appview/dist/ "${{ env.APPVIEW_DIR }}/dist/"
          rsync -a --delete appview/drizzle/ "${{ env.APPVIEW_DIR }}/drizzle/"
          cp appview/package.json appview/pnpm-lock.yaml appview/pnpm-workspace.yaml "${{ env.APPVIEW_DIR }}/"
          cd "${{ env.APPVIEW_DIR }}"
          pnpm install --prod --frozen-lockfile
          sudo systemctl restart "${{ env.APPVIEW_SERVICE }}"

      - name: Check appview is running
        run: |
          sleep 5
          if ! systemctl is-active --quiet "${{ env.APPVIEW_SERVICE }}"; then
            journalctl -u "${{ env.APPVIEW_SERVICE }}" -n 50 --no-pager || true
            exit 1
          fi
