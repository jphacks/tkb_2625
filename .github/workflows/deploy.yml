name: Deploy

on:
  push:
    branches: [main]

concurrency: deploy

env:
  CLIENT_DIR: /srv/rogaining/client
  APPVIEW_DIR: /srv/rogaining/appview
  APPVIEW_SERVICE: rogaining-appview.service

# self-hosted runner 側で必要なもの: node, pnpm, rsync
# リポジトリ Variables: APPVIEW_DIR (例 /srv/rogaining/appview), CLIENT_DIR (例 /srv/rogaining/client)
# APPVIEW_SERVICE は systemd unit。runnerユーザーがパスワードなしで
# `sudo systemctl restart <unit>` できるようにしておく
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build client
        working-directory: client
        run: |
          pnpm install
          pnpm build

      - name: Build appview
        working-directory: appview
        run: |
          pnpm install
          pnpm build

      - name: Deploy client
        run: rsync -a --delete client/dist/ "${{ env.CLIENT_DIR }}/"

      - name: Deploy appview
        run: |
          rsync -a --delete appview/dist/ "${{ env.APPVIEW_DIR }}/dist/"
          cp appview/package.json "${{ env.APPVIEW_DIR }}/"
          cd "${{ env.APPVIEW_DIR }}"
          pnpm install --prod
          sudo systemctl restart "${{ env.APPVIEW_SERVICE }}"
