name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

env:
  CLIENT_DIR: /srv/rogaining/client
  APPVIEW_DIR: /srv/rogaining/appview
  APPVIEW_SERVICE: rogaining-appview.service

# self-hosted runner 側で必要なもの: rsync
# リポジトリ Variables: APPVIEW_DIR (例 /srv/rogaining/appview), CLIENT_DIR (例 /srv/rogaining/client)
# APPVIEW_SERVICE は systemd unit。runnerユーザーがパスワードなしで
# `sudo systemctl restart <unit>` できるようにしておく
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build client
        working-directory: client
        run: |
          pnpm install
          pnpm build

      - name: Build appview
        working-directory: appview
        run: |
          pnpm install
          pnpm build

      - name: Deploy client
        run: rsync -a --delete client/dist/ "${{ env.CLIENT_DIR }}/"

      - name: Deploy appview
        run: |
          rsync -a --delete appview/dist/ "${{ env.APPVIEW_DIR }}/dist/"
          cp appview/package.json "${{ env.APPVIEW_DIR }}/"
          cd "${{ env.APPVIEW_DIR }}"
          pnpm install --prod
          sudo systemctl restart "${{ env.APPVIEW_SERVICE }}"
