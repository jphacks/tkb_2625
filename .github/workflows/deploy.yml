name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

env:
  CLIENT_DIR: /srv/rogaining/client
  APPVIEW_DIR: /srv/rogaining/appview
  APPVIEW_SERVICE: rogaining-appview.service
  JUDGE_WRAPPER_DIR: /srv/rogaining/judge-wrapper
  JUDGMAN_DIR: /srv/rogaining/judgman
  JUDGE_WRAPPER_SERVICE: rogaining-judge-wrapper.service

# self-hosted runner 側で必要なもの: rsync, python3 (venv モジュール込み)
# リポジトリ Variables: APPVIEW_DIR (例 /srv/rogaining/appview), CLIENT_DIR (例 /srv/rogaining/client)
# APPVIEW_SERVICE / JUDGE_WRAPPER_SERVICE は systemd unit。runnerユーザーがパスワードなしで
# `sudo systemctl restart <unit>` できるようにしておく
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build client
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build appview
        working-directory: appview
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build judge-wrapper
        working-directory: judge-wrapper
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy client
        run: rsync -a --delete client/dist/ "${{ env.CLIENT_DIR }}/"

      # マイグレーションは appview の起動時に drizzle/ から自動で適用される
      # pnpm-workspace.yaml は better-sqlite3 のネイティブビルド許可 (allowBuilds) に必要
      - name: Deploy appview
        run: |
          rsync -a --delete appview/dist/ "${{ env.APPVIEW_DIR }}/dist/"
          rsync -a --delete appview/drizzle/ "${{ env.APPVIEW_DIR }}/drizzle/"
          cp appview/package.json appview/pnpm-lock.yaml appview/pnpm-workspace.yaml "${{ env.APPVIEW_DIR }}/"
          cd "${{ env.APPVIEW_DIR }}"
          pnpm install --prod --frozen-lockfile
          sudo systemctl restart "${{ env.APPVIEW_SERVICE }}"

      # 学習用の画像 (dataset, point-*) は判定に不要なので送らない
      # .venv は deploy 先で作るので --delete で消さないよう除外する
      - name: Deploy judgman
        run: |
          rsync -a --delete \
            --exclude '/dataset/' --exclude '/point-*/' \
            --exclude '/.venv/' --exclude '__pycache__/' \
            judgman/ "${{ env.JUDGMAN_DIR }}/"
          cd "${{ env.JUDGMAN_DIR }}"
          [ -x .venv/bin/python ] || python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir --quiet -r requirements.txt

      - name: Deploy judge-wrapper
        run: |
          rsync -a --delete judge-wrapper/dist/ "${{ env.JUDGE_WRAPPER_DIR }}/dist/"
          cp judge-wrapper/package.json judge-wrapper/pnpm-lock.yaml judge-wrapper/pnpm-workspace.yaml "${{ env.JUDGE_WRAPPER_DIR }}/"
          cd "${{ env.JUDGE_WRAPPER_DIR }}"
          pnpm install --prod --frozen-lockfile
          sudo systemctl restart "${{ env.JUDGE_WRAPPER_SERVICE }}"

      - name: Check services are running
        run: |
          sleep 5
          failed=0
          for unit in "${{ env.APPVIEW_SERVICE }}" "${{ env.JUDGE_WRAPPER_SERVICE }}"; do
            if ! systemctl is-active --quiet "$unit"; then
              journalctl -u "$unit" -n 50 --no-pager || true
              failed=1
            fi
          done
          exit $failed
